[project]
name = "autocad-mcp"
version = "4.0.0"
description = "MCP server for direct AutoCAD bridge control and headless DXF generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.1,<2.0",
    "ezdxf>=0.18",
    "matplotlib>=3.7",
    "Pillow>=10.0.0",
    "structlog>=24.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]

# Keep temporary compiler/check artifacts out of source distributions while
# retaining the bridge source needed to build the AutoCAD plugin separately.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/bridge",
    "/lisp-code",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "/work",
    "/dist",
    "/.venv",
    "/.pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
